<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact – Vestes</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <style>
        .form-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 64px;
        }
        .form-container {
            width: 100%;
            max-width: 560px;
        }
        .form-title {
            font-size: 11px;
            letter-spacing: 5px;
            font-weight: 400;
            margin-bottom: 48px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 28px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 10px;
            letter-spacing: 3px;
            margin-bottom: 8px;
            color: #888;
            transition: color 0.3s ease;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: none;
            border-bottom: 1px solid #d0d0d0;
            padding: 10px 0;
            font-size: 14px;
            letter-spacing: 1px;
            background: transparent;
            outline: none;
            font-family: inherit;
            color: #000;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-bottom-color: #000;
        }
        .form-group textarea {
            resize: none;
            height: 80px;
        }
        .form-group select {
            appearance: none;
            cursor: pointer;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }
        .form-group input.error,
        .form-group select.error,
        .form-group textarea.error {
            border-bottom-color: #cc0000;
        }
        .error-msg {
            font-size: 10px;
            letter-spacing: 1px;
            color: #cc0000;
            margin-top: 6px;
            display: none;
        }
        .error-msg.visible {
            display: block;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #000;
            color: #fff;
            border: none;
            font-size: 11px;
            letter-spacing: 4px;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .btn-submit:hover { background: #333; transform: translateY(-1px); }
        .btn-submit:active { transform: translateY(0); }
        .char-counter {
            text-align: right;
            font-size: 10px;
            color: #aaa;
            margin-top: 4px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">VESTES</div>
    <nav>
        <ul class="menu">
            <li><a href="../index.html">HOME</a></li>
            <li><a href="clothing.html">CLOTHING</a></li>
            <li><a href="shoes.html">SHOES</a></li>
            <li><a href="accessories.html">ACCESSORIES</a></li>
            <li><a href="form.html">CONTACT</a></li>
        </ul>
    </nav>
</header>

<section class="form-section">
    <div class="form-container">
        <h2 class="form-title">PLACE AN ORDER</h2>

        <!-- Lab 4, Sarcina 1: method=POST, trimite date pe server catre scriptul CGI -->
        <form id="order-form" method="POST" action="../cgi-bin/process.py" novalidate>

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">FIRST NAME</label>
                    <input type="text" id="firstName" name="firstName" placeholder="John">
                    <span class="error-msg" id="firstName-error"></span>
                </div>
                <div class="form-group">
                    <label for="lastName">LAST NAME</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Doe">
                    <span class="error-msg" id="lastName-error"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" name="email" placeholder="john@example.com">
                <span class="error-msg" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="phone">PHONE NUMBER</label>
                <input type="tel" id="phone" name="phone" placeholder="+373 xxx xxx xx">
                <span class="error-msg" id="phone-error"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="category">CATEGORY</label>
                    <select id="category" name="category">
                        <option value="">— SELECT —</option>
                        <option value="clothing">Clothing</option>
                        <option value="shoes">Shoes</option>
                        <option value="accessories">Accessories</option>
                    </select>
                    <span class="error-msg" id="category-error"></span>
                </div>
                <div class="form-group">
                    <label for="size">SIZE</label>
                    <select id="size" name="size">
                        <option value="">— SELECT —</option>
                        <option value="XS">XS</option>
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                    </select>
                    <span class="error-msg" id="size-error"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="message">ADDITIONAL NOTES</label>
                <textarea id="message" name="message" placeholder="Special requests, color preferences..."></textarea>
                <div class="char-counter"><span id="char-count">0</span> / 200</div>
            </div>

            <button type="submit" class="btn-submit">SUBMIT ORDER</button>

        </form>
    </div>
</section>

<footer>
    © 2026 VESTES
    <div class="footer-contact">
        contact@vestes.com · Instagram @vestes
    </div>
</footer>

<script>
    // ─────────────────────────────────────────────────────────
    //  Lab 4, Sarcina 4 — JS verificarea corectitudinii datelor
    //  Ruleaza inainte de trimiterea formularului pe server
    // ─────────────────────────────────────────────────────────

    const form      = document.getElementById('order-form');
    const textarea  = document.getElementById('message');
    const charCount = document.getElementById('char-count');

    // ── 1. Contor caractere textarea ──
    textarea.addEventListener('input', function () {
        if (this.value.length > 200) this.value = this.value.substring(0, 200);
        const len = this.value.length;
        charCount.textContent = len;
        charCount.style.color = len >= 180 ? '#cc0000' : '#aaa';
    });

    // ── 2. Validare in timp real (la blur si la input dupa eroare) ──
    document.querySelectorAll('input, select, textarea').forEach(function (field) {
        field.addEventListener('blur', function () { validateField(this); });
        field.addEventListener('input', function () {
            if (this.classList.contains('error')) validateField(this);
        });
    });

    // ── 3. Functia de validare a unui camp ──
    function validateField(field) {
        const id    = field.id;
        const value = field.value.trim();
        let valid   = true;
        let msg     = '';

        if (id === 'firstName' || id === 'lastName') {
            if (value.length < 2) {
                valid = false; msg = 'Minimum 2 characters required';
            } else if (!/^[A-Za-zÀ-ÖØ-öø-ÿ\s\-]+$/.test(value)) {
                valid = false; msg = 'Only letters and hyphens allowed';
            }
        } else if (id === 'email') {
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) {
                valid = false; msg = 'Please enter a valid email address';
            }
        } else if (id === 'phone') {
            if (!/^[\+\d\s\-\(\)]{7,20}$/.test(value)) {
                valid = false; msg = 'Enter a valid phone number (7–20 digits)';
            }
        } else if (id === 'category' || id === 'size') {
            if (value === '') {
                valid = false; msg = 'Please make a selection';
            }
        }

        const errorEl = document.getElementById(id + '-error');
        if (errorEl) {
            errorEl.textContent = msg;
            field.classList.toggle('error', !valid);
            errorEl.classList.toggle('visible', !valid);
        }
        return valid;
    }

    // ── 4. Submit: validare completa inainte de POST ──
    //  Daca toate campurile sunt corecte → formularul se trimite pe server (CGI)
    //  Daca exista erori → opreste trimiterea si evidentiaza campurile gresite
    form.addEventListener('submit', function (e) {
        const ids      = ['firstName', 'lastName', 'email', 'phone', 'category', 'size'];
        let   allValid = true;
        let   first    = null;

        ids.forEach(function (id) {
            const field = document.getElementById(id);
            if (!validateField(field)) {
                allValid = false;
                if (!first) first = field;
            }
        });

        if (!allValid) {
            e.preventDefault(); // Blocheaza POST — nu trimite pe server
            first.focus();
            first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        // Daca allValid === true → form.submit() spre cgi-bin/process.py
    });
</script>

</body>
</html>
